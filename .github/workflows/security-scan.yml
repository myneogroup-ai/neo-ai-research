# security-scan.yml - 2026-11-15 (directive V5.0 section 5.6). Same workflow as neo-ai-origin (ADR-0053, ADR-0055 there).
#   gitleaks  : secret detection on the working tree (v8.30.1, release checksum verified before use)
#   semgrep   : SAST with the public rulesets (Semgrep OSS 1.185.0, pinned on PyPI); ERROR findings fail, and on a pull
#               request only findings NEW against the base branch count. The full list is published as the
#               "semgrep report" check run (rule, severity, file:line; no code).
# Never deploys, reads no secret, needs no paid licence.
name: security-scan

on:
  pull_request:
  push:
    branches-ignore: [main]
  schedule:
    - cron: "17 3 * * 1"   # weekly full report, Monday 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  SEMGREP_VERSION: "1.185.0"

jobs:
  gitleaks:
    name: secrets (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: install gitleaks (checksum verified)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tgz" "$base/$tgz"
          curl -sSfL -o "$RUNNER_TEMP/sums.txt" "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd "$RUNNER_TEMP" && grep " ${tgz}\$" sums.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: scan the working tree (no secret value is ever printed)
        run: |
          set -uo pipefail
          "$RUNNER_TEMP/gitleaks" dir . --redact --no-banner --exit-code 0 --report-format json --report-path "$RUNNER_TEMP/gitleaks.json"
          python3 - "$RUNNER_TEMP/gitleaks.json" <<'PY'
          import json, sys
          findings = json.load(open(sys.argv[1])) or []
          by_rule = {}
          for f in findings:
              by_rule[f.get("RuleID", "?")] = by_rule.get(f.get("RuleID", "?"), 0) + 1
          by_file = {}
          for f in findings:
              by_file.setdefault(f.get("File"), []).append(f)
          for path, items in sorted(by_file.items())[:50]:  # one annotation per file, so none is hidden by the cap
              lines = ",".join(str(i.get("StartLine")) for i in items[:20])
              rules = ",".join(sorted({i.get("RuleID", "?") for i in items}))
              print(f"::error file={path},line={items[0].get('StartLine')}::gitleaks {len(items)} finding(s) {rules} at lines {lines}")
          print(f"::notice::gitleaks: {len(findings)} finding(s) " + ", ".join(f"{k}={v}" for k, v in sorted(by_rule.items())))
          sys.exit(1 if findings else 0)
          PY

  semgrep:
    name: SAST (semgrep OSS)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write   # only to publish the full findings list as a "semgrep report" check run (rule ids and lines, no code)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: install semgrep
        run: python3 -m pip install --quiet "semgrep==${SEMGREP_VERSION}"
      - name: scan (pull request - new findings only; otherwise full report)
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT: ${{ github.event_name }}
        run: |
          set -uo pipefail
          # Reviewed exclusions shared with neo-ai-origin (ADR-0055 there): Playwright goto in internal QA scripts;
          # Kubernetes securityContext rules on Cloud Run YAML; tools/migration-guard (verbatim shared copy, ADR-0040).
          args=(scan --config p/default --config p/secrets --metrics=off --exclude node_modules --exclude dist
                --exclude tools/migration-guard
                --exclude-rule javascript.playwright.security.audit.playwright-goto-injection.playwright-goto-injection
                --exclude-rule yaml.kubernetes.security.allow-privilege-escalation-no-securitycontext.allow-privilege-escalation-no-securitycontext
                --exclude-rule yaml.kubernetes.security.run-as-non-root.run-as-non-root
                --json --output "$RUNNER_TEMP/semgrep.json")
          if [ "$EVENT" = "pull_request" ]; then
            # fetch-depth 0 already brought origin/<base>; a credential-less fetch would fail (exit 128)
            args+=(--baseline-commit "$(git merge-base "origin/${BASE_REF}" HEAD)")
          fi
          semgrep "${args[@]}"
          rc=$?
          python3 - "$RUNNER_TEMP/semgrep.json" "$EVENT" "$rc" <<'PY'
          import json, sys
          path, event, rc = sys.argv[1], sys.argv[2], int(sys.argv[3])
          try:
              data = json.load(open(path))
          except Exception as exc:
              print(f"::error::semgrep produced no report (exit {rc}): {exc}")
              sys.exit(1)
          results, errors = data.get("results", []), data.get("errors", [])
          by_sev = {}
          for r in results:
              sev = r.get("extra", {}).get("severity", "?")
              by_sev[sev] = by_sev.get(sev, 0) + 1
          rank = {"ERROR": 0, "WARNING": 1, "MEDIUM": 2, "INFO": 3}
          results.sort(key=lambda r: rank.get(r.get("extra", {}).get("severity"), 9))
          for r in results[:50]:
              print(f"::warning file={r.get('path')},line={r.get('start', {}).get('line')}::semgrep {r.get('check_id')}")
          print(f"::notice::semgrep ({event}): {len(results)} finding(s) {by_sev}, {len(errors)} scan error(s)")
          blocking = any(r.get("extra", {}).get("severity") == "ERROR" for r in results)
          sys.exit(1 if blocking else 0)
          PY
      - name: publish the full findings list as a check run (rule, severity, file:line only)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail
          [ -f "$RUNNER_TEMP/semgrep.json" ] || exit 0
          python3 - "$RUNNER_TEMP/semgrep.json" > "$RUNNER_TEMP/report.json" <<'PY'
          import json, os, sys
          data = json.load(open(sys.argv[1]))
          rank = {"ERROR": 0, "WARNING": 1, "MEDIUM": 2, "INFO": 3}
          rows = sorted(data.get("results", []), key=lambda r: (rank.get(r.get("extra", {}).get("severity"), 9), r.get("path", ""), r.get("start", {}).get("line", 0)))
          lines = [f"{len(rows)} finding(s), {len(data.get('errors', []))} scan error(s)", "", "| Severity | Rule | Location |", "|---|---|---|"]
          for r in rows:
              lines.append(f"| {r.get('extra', {}).get('severity')} | {r.get('check_id')} | {r.get('path')}:{r.get('start', {}).get('line')} |")
          text = "\n".join(lines)[:60000]
          print(json.dumps({"name": "semgrep report", "head_sha": os.environ["HEAD_SHA"], "status": "completed", "conclusion": "neutral",
                            "output": {"title": f"semgrep: {len(rows)} finding(s)", "summary": lines[0], "text": text}}))
          PY
          curl -sS -o /dev/null -w "check run: HTTP %{http_code}\n" -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/check-runs" --data @"$RUNNER_TEMP/report.json"
