# Canonical label set. Applied by .github/workflows/labels.yml on every push to main that
# touches this file. Labels not listed here are deleted, so this file is the whole set.

# --- Type -------------------------------------------------------------------
- name: "type: correction"
  color: "0e8a16"
  description: "A factual error in a published document"
- name: "type: erratum"
  color: "0e8a16"
  description: "A confirmed correction requiring a published erratum"
- name: "type: glossary"
  color: "1d76db"
  description: "A definition, a collision, or a proposed term"
- name: "type: question"
  color: "5319e7"
  description: "A question about the corpus or the method"
- name: "type: build"
  color: "c5def5"
  description: "Scripts, workflows, generators, CI"
- name: "type: seo"
  color: "c5def5"
  description: "Discovery, structured data, sitemaps, feeds, llms.txt"
- name: "type: content"
  color: "bfd4f2"
  description: "Website copy that is not a publication"
- name: "type: chore"
  color: "ededed"
  description: "Housekeeping with no reader-visible effect"

# --- Severity ---------------------------------------------------------------
- name: "severity: disclosure"
  color: "b60205"
  description: "Suspected classified material published in error. Handled privately, never discussed in the issue"
- name: "severity: capability-overclaim"
  color: "b60205"
  description: "A capability reads as deployed when its status says otherwise"
- name: "severity: citation-integrity"
  color: "b60205"
  description: "A pinned version, an identifier or a canonical URL is wrong or has moved"
- name: "severity: major"
  color: "d93f0b"
  description: "Changes what a document asserts"
- name: "severity: minor"
  color: "fbca04"
  description: "Does not change what a document asserts"

# --- Claim class ------------------------------------------------------------
- name: "claim: E established"
  color: "006b75"
  description: "Concerns a claim requiring an external primary source"
- name: "claim: A architectural"
  color: "006b75"
  description: "Concerns an architectural interpretation"
- name: "claim: D design-intent"
  color: "006b75"
  description: "Concerns a statement of design intent and its capability status"
- name: "claim: O open-problem"
  color: "006b75"
  description: "Concerns a named open problem"

# --- Document ---------------------------------------------------------------
- name: "doc: R papers"
  color: "e99695"
  description: "A research paper"
- name: "doc: P institutional"
  color: "e99695"
  description: "An institutional publication"
- name: "doc: TN technical-note"
  color: "e99695"
  description: "A technical note"
- name: "doc: glossary"
  color: "e99695"
  description: "The controlled vocabulary"
- name: "doc: platform-pages"
  color: "e99695"
  description: "Platform and company pages"
- name: "doc: founder-site"
  color: "e99695"
  description: "mickaelmosse.ai content"

# --- State ------------------------------------------------------------------
- name: "state: needs-source"
  color: "fef2c0"
  description: "A primary source is required before this can be assessed"
- name: "state: needs-founder-ruling"
  color: "fef2c0"
  description: "Blocked on a governance decision, not on work"
- name: "state: gate-b"
  color: "fef2c0"
  description: "In independent document review"
- name: "state: gate-c"
  color: "fef2c0"
  description: "In release review"
- name: "state: blocked"
  color: "d4c5f9"
  description: "Cannot proceed"
- name: "state: wontfix"
  color: "ffffff"
  description: "Declined, with the reason recorded in the thread"

# --- Wave -------------------------------------------------------------------
- name: "wave: 1"
  color: "0052cc"
  description: "Public Wave 1"
- name: "wave: 1b"
  color: "0052cc"
  description: "Public Wave 1b, the reduced public editions"
- name: "wave: 2"
  color: "0052cc"
  description: "Not scheduled"

# --- Entry points -----------------------------------------------------------
- name: "good first issue"
  color: "7057ff"
  description: "Small, well bounded, no corpus context required"
- name: "help wanted"
  color: "008672"
  description: "External contribution welcome"
