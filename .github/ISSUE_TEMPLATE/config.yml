blank_issues_enabled: false
contact_links:
  - name: Suspected disclosure of classified material
    url: https://github.com/myneogroup-ai/neo-ai-research/security/advisories/new
    about: >-
      If you believe something published here should not be public, report it privately.
      Do not open an issue. A public issue describing where a disclosure is amplifies it.
  - name: Security or credential report
    url: https://github.com/myneogroup-ai/neo-ai-research/security/policy
    about: Read SECURITY.md and use private vulnerability reporting.
  - name: Question about the method rather than a document
    url: https://neoai.myneogroup.com/research/methodology/
    about: >-
      Claim classes, evidence tiers, capability statuses and how to cite are all answered
      on the method page. Please read it before opening a question.
  - name: Media, partnership or commercial enquiry
    url: https://neoai.myneogroup.com/company/contact/
    about: This repository is for the research corpus. Commercial enquiries go elsewhere.
