version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["type: chore"]
    commit-message:
      prefix: "chore(actions)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    labels: ["type: chore"]
    commit-message:
      prefix: "chore(deps)"
